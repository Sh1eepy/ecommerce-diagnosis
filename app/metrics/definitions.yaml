# 指标口径注册表（唯一来源）
#
# 注意：Retailrocket 无独立"曝光/点击"字段，漏斗为 view→addtocart→transaction 三段；
#       点击率 = 独立浏览用户/曝光（代理口径）。
# 价格：item_properties prop=790（纯数值）提取为最新价，GMV/客单价为真实口径
#      （V1 用最新价格近似，未按"事件当日生效价"join）。

funnel_stages:
  - { name: view,        label: 曝光/浏览 }
  - { name: addtocart,   label: 加购 }
  - { name: transaction, label: 成交(支付代理) }

metrics:
  uv:
    label: 独立访客数
    unit: 人
  view_count:
    label: 曝光/浏览次数
    unit: 次
  per_user_views:
    label: 人均浏览量
    unit: 次
  click_rate:
    label: 点击率(独立浏览/曝光)
    unit: "%"
  addcart_rate:
    label: 加购率
    unit: "%"
  cvr:
    label: 支付转化率
    unit: "%"
  cart_to_pay:
    label: 加购→支付转化率
    unit: "%"
  gmv:
    label: GMV(成交笔数×最新价)
    unit: 元
  avg_price:
    label: 客单价(GMV/成交笔数)
    unit: 元
