# gitleaks 配置：忽略明确的白名单项，其余仍按默认规则严格扫描。
# 说明：这些是"占位符/配置变量引用"，不是真实密钥。
# - .env.example 是模板文件，全是占位符（sk-your-deepseek-key / change_me / dev-key-123）
# - settings.XXX 是代码里读取配置的变量引用（非密钥本体）

title = "ecommerce-diagnosis gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "占位符模板与 settings 变量引用（非真实密钥）"
paths = [
  '''^\.env\.example$''',
]
regexes = [
  '''settings\.[A-Z_]+''',        # 代码里的配置引用，如 settings.DB_WRITE_PASSWORD
  '''dev-key-123''',              # 文档示例占位 Key
  '''change_me''',                # .env.example 占位密码
  '''sk-your-deepseek-key''',     # .env.example 占位 LLM Key
  '''SjXDbrd9vSL497romp7-Q-9pr05n6c2z''',  # 已作废的历史 Key（防止旧引用误报）
]
